# Local services for development and E2E tests (architecture section 2).
# Start with: docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: gcli
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gcli"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage (the production target is Cloudflare R2; MinIO no longer
  # publishes container images). S3 API on port 8333.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  seaweedfs-setup:
    image: chrislusf/seaweedfs:latest
    depends_on:
      - seaweedfs
    restart: on-failure
    entrypoint:
      [
        "/bin/sh",
        "-c",
        'sleep 5 && echo "s3.bucket.create -name gcli-local" | weed shell -master=seaweedfs:9333',
      ]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  seaweedfs-data:

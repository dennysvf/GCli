# Local services for development and E2E tests (architecture section 2).
# Start with: docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: gcli
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gcli"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage (the production target is Cloudflare R2; MinIO no longer
  # publishes container images). S3 API on port 8333.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  seaweedfs-setup:
    image: chrislusf/seaweedfs:latest
    depends_on:
      - seaweedfs
    # Retries while the master is still starting; capped so a real failure cannot loop forever.
    restart: on-failure:10
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        out=$$(echo "s3.bucket.create -name gcli-local" | weed shell -master=seaweedfs:9333 2>&1)
        rc=$$?
        echo "$$out"
        # This runs again on every `docker compose up`: an existing bucket is success, not failure.
        if [ $$rc -ne 0 ] && ! echo "$$out" | grep -q "already exists"; then exit 1; fi

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Full stack in containers: docker compose --profile app up -d --build
  # (the web app is served on http://localhost:3000; development uses npm run dev on 3001).
  migrate:
    profiles: ["app"]
    build:
      context: .
      secrets: [extra_ca]
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_MIGRATION_URL: postgresql://gcli_owner:gcli_owner@postgres:5432/gcli
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      secrets: [extra_ca]
    ports:
      - "3000:3000"
    environment: &app-env
      DATABASE_URL: postgresql://gcli_app:gcli_app@postgres:5432/gcli
      DATABASE_MIGRATION_URL: postgresql://gcli_owner:gcli_owner@postgres:5432/gcli
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-docker-compose-local-secret-change-me-32chars}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: GCli <no-reply@gcli.local>
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: gcli-local
      S3_ACCESS_KEY_ID: gcli
      S3_SECRET_ACCESS_KEY: gcli-local-secret
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: ["app"]
    build:
      context: .
      secrets: [extra_ca]
    command: ["npx", "tsx", "src/worker/index.ts"]
    environment:
      <<: *app-env
      GCLI_PROCESS: worker
    # The image health check probes the web server; the worker has no HTTP endpoint.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

# Optional root certificate for HTTPS-intercepting networks or antivirus during image builds:
# EXTRA_CA_CERTS=/path/to/root.pem docker compose --profile app build
secrets:
  extra_ca:
    file: ${EXTRA_CA_CERTS:-./docker/no-extra-ca.txt}

volumes:
  postgres-data:
  seaweedfs-data:
